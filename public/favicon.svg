<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#050505"/>
  <g stroke="#abff4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
